services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twitteros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twitteros}
      POSTGRES_DB: ${POSTGRES_DB:-twitteros}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twitteros}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - appnet
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - appnet
    env_file:
      - .env

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://twitteros:twitteros@db:5432/twitteros}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - appnet
    env_file:
      - .env

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://twitteros:twitteros@db:5432/twitteros}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - appnet
    env_file:
      - .env

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: beat
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://twitteros:twitteros@db:5432/twitteros}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - appnet
    env_file:
      - .env

  flower:
    image: mher/flower:latest
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      FLOWER_PORT: ${FLOWER_PORT:-5555}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped
    networks:
      - appnet
    env_file:
      - .env

  frontend:
    labels:
    - traefik.enable=true
    - traefik.http.routers.frontend.rule=Host(`twitteros.troikacompanies.com`)
    - traefik.http.routers.frontend.entrypoints=http
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - appnet
    env_file:
      - .env

volumes:
  postgres-data:
  redis-data:

networks:
  appnet:
    driver: bridge
